kind = "web"
previewPath = "/"
title = "AcquiSight"
description = "A premium AI-powered land acquisition intelligence platform for spotting risks, predicting delays, and turning acquisition data into proactive action."
version = "1.0.0"
id = "artifacts/acquisight"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25425

[services.development]
run = "pnpm --filter @workspace/acquisight run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/acquisight", "run", "build" ]
serve = "static"
publicDir = "artifacts/acquisight/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25425"
BASE_PATH = "/"
